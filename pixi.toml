[workspace]
name = "orocos-rock"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[dependencies]
castxml = ">=0.7,<0.8"
cmake = ">=3.28,<4"
cxx-compiler = ">=1.11,<3"
git = ">=2.45,<3"
pkg-config = ">=0.29,<1"
ruby = ">=3.4,<3.5"
zstd = ">=1.5,<2"

[feature.package.dependencies]
python = ">=3.11,<3.15"
rattler-build = ">=0.74,<0.75"
rattler-index = ">=0.30,<0.31"
zstd = ">=1.5,<2"

[feature.package.tasks]
package-render = { cmd = [
    "rattler-build",
    "build",
    "--recipe",
    "packaging/conda/recipe.yaml",
    "--output-dir",
    "packaging/conda/output",
    "--channel",
    "conda-forge",
    "--target-platform",
    "win-64",
    "--render-only",
    "--with-solve",
], description = "Render and solve the Windows Orocos package recipe." }
package-build-artifacts = { cmd = [
    "rattler-build",
    "build",
    "--recipe",
    "packaging/conda/recipe.yaml",
    "--output-dir",
    "packaging/conda/output",
    "--channel",
    "conda-forge",
    "--target-platform",
    "win-64",
    "--package-format",
    "conda",
    "--test",
    "native",
], description = "Build and test the Windows orocos and orocos-dev package artifacts." }
package-build = { cmd = [
    "rattler-index",
    "--force",
    "--target-platform",
    "win-64",
    "fs",
    "packaging/conda/output",
], depends-on = ["package-build-artifacts"], description = "Build, test, and index the Windows orocos and orocos-dev packages." }

linux-package-render = { cmd = [
    "rattler-build",
    "build",
    "--recipe",
    "packaging/conda/recipe-linux.yaml",
    "--output-dir",
    "packaging/conda/output",
    "--channel",
    "conda-forge",
    "--target-platform",
    "linux-64",
    "--render-only",
    "--with-solve",
], description = "Render and solve the Linux Orocos package recipe." }
linux-package-build-artifacts = { cmd = [
    "rattler-build",
    "build",
    "--recipe",
    "packaging/conda/recipe-linux.yaml",
    "--output-dir",
    "packaging/conda/output",
    "--channel",
    "conda-forge",
    "--target-platform",
    "linux-64",
    "--package-format",
    "conda",
    "--test",
    "native",
], description = "Build and test the Linux orocos and orocos-dev package artifacts." }
linux-package-build = { cmd = [
    "rattler-index",
    "--force",
    "--target-platform",
    "linux-64",
    "fs",
    "packaging/conda/output",
], depends-on = ["linux-package-build-artifacts"], description = "Build, test, and index the Linux orocos and orocos-dev packages." }

[feature.docs.dependencies]
mdbook = ">=0.5.0,<0.5.1"
mdbook-mermaid = ">=0.17.1,<0.18"
ruby = ">=3.4,<3.5"

[feature.docs.tasks]
docs-lint = { cmd = ["ruby", "tools/check-docs.rb"], description = "Validate the documentation structure and local links." }
docs-build = { cmd = ["mdbook", "build", "docs"], depends-on = ["docs-lint"], description = "Validate and build the documentation site." }
docs-serve = { cmd = ["mdbook", "serve", "docs", "--open"], depends-on = ["docs-lint"], description = "Serve the documentation site locally." }

[environments]
package = { features = ["package"], no-default-feature = true }
docs = { features = ["docs"], no-default-feature = true }

[activation.env]
OROCOS_TARGET = "win32"

[tasks]
windows-build = { cmd = [
    "powershell.exe",
    "-NoProfile",
    "-ExecutionPolicy",
    "Bypass",
    "-File",
    "tools/build-windows-msvc.ps1",
    "-Workspace",
    "build/windows-msvc",
    "-Prefix",
    "install/windows-msvc",
    "-VcpkgRoot",
    "build/vcpkg",
], description = "Build and validate the native Windows runtime and OroGen development prefix." }
