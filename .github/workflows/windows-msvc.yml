name: Windows Native Toolchain

on:
  pull_request:
    paths:
      - ".github/workflows/windows-msvc.yml"
      - "tools/build-windows-msvc.ps1"
      - "tools/windows-source-lock.ps1"
      - "tools/test-windows-source-lock.ps1"
      - "tools/export-windows-env.ps1"
      - "tools/install-ruby-tools.ps1"
      - "tools/windows-generator-smoke/**"
      - "tools/windows-opcua-start-smoke.ops"
      - "tools/windows-patches/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".gitattributes"
      - ".gitignore"
      - "autoproj/**"
      - "packaging/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-msvc.yml"
      - "tools/build-windows-msvc.ps1"
      - "tools/windows-source-lock.ps1"
      - "tools/test-windows-source-lock.ps1"
      - "tools/export-windows-env.ps1"
      - "tools/install-ruby-tools.ps1"
      - "tools/windows-generator-smoke/**"
      - "tools/windows-opcua-start-smoke.ops"
      - "tools/windows-patches/**"
      - "pixi.toml"
      - "pixi.lock"
      - ".gitattributes"
      - ".gitignore"
      - "autoproj/**"
      - "packaging/**"
  repository_dispatch:
    types:
      - windows-msvc-integration
  workflow_dispatch:
    inputs:
      rtt_ref:
        description: RTT branch, tag, or SHA
        required: false
        default: dev
      ocl_ref:
        description: OCL branch, tag, or SHA
        required: false
        default: dev
      utilmm_ref:
        description: utilmm branch, tag, or SHA
        required: false
        default: dev
      typelib_ref:
        description: Typelib branch, tag, or SHA
        required: false
        default: dev
      rtt_typelib_ref:
        description: rtt_typelib branch, tag, or SHA
        required: false
        default: dev
      orogen_ref:
        description: OroGen branch, tag, or SHA
        required: false
        default: dev

jobs:
  build:
    name: Windows native / Windows 2022
    runs-on: windows-2022
    timeout-minutes: 90

    env:
      OROCOS_TARGET: win32
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads
      RTT_REF: ${{ github.event.inputs.rtt_ref || github.event.client_payload.rtt_ref || 'dev' }}
      OCL_REF: ${{ github.event.inputs.ocl_ref || github.event.client_payload.ocl_ref || 'dev' }}
      UTILMM_REF: ${{ github.event.inputs.utilmm_ref || github.event.client_payload.utilmm_ref || 'dev' }}
      TYPELIB_REF: ${{ github.event.inputs.typelib_ref || github.event.client_payload.typelib_ref || 'dev' }}
      RTT_TYPELIB_REF: ${{ github.event.inputs.rtt_typelib_ref || github.event.client_payload.rtt_typelib_ref || 'dev' }}
      OROGEN_REF: ${{ github.event.inputs.orogen_ref || github.event.client_payload.orogen_ref || 'dev' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.2
          environments: default
          locked: true
          cache: true

      - name: Restore vcpkg downloads and binary packages
        uses: actions/cache@v6
        with:
          path: |
            .cache/vcpkg/archives
            .cache/vcpkg/downloads
          key: windows-vcpkg-x64-${{ hashFiles('packaging/source-lock.json', 'tools/build-windows-msvc.ps1') }}
          restore-keys: |
            windows-vcpkg-x64-

      - name: Validate Windows source lock
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File tools/test-windows-source-lock.ps1

      - name: Build Windows prefix
        shell: pwsh
        run: |
          New-Item build/windows-msvc -ItemType Directory -Force | Out-Null
          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & pixi run --locked windows-build -- `
            -RttRef "$env:RTT_REF" `
            -OclRef "$env:OCL_REF" `
            -UtilmmRef "$env:UTILMM_REF" `
            -TypelibRef "$env:TYPELIB_REF" `
            -RttTypelibRef "$env:RTT_TYPELIB_REF" `
            -OrogenRef "$env:OROGEN_REF" 2>&1 |
            Tee-Object -FilePath build/windows-msvc/ci-console.log
          $buildExitCode = $LASTEXITCODE
          $ErrorActionPreference = $savedErrorActionPreference
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Report Windows build failure
        if: failure()
        shell: pwsh
        run: |
          $logPath = 'build/windows-msvc/ci-console.log'
          if (Test-Path -LiteralPath $logPath -PathType Leaf) {
            $message = (Get-Content -LiteralPath $logPath -Tail 30) -join "`n"
          } else {
            $message = "Missing Windows build console log: $logPath"
          }
          $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::error title=Windows build diagnostic::$message"

      - name: Upload Windows build logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: windows-msvc-logs
          if-no-files-found: ignore
          path: |
            build/windows-msvc/**/CMakeFiles/CMakeOutput.log
            build/windows-msvc/**/CMakeFiles/CMakeError.log
            build/windows-msvc/**/*.log
