name: Windows Conda Packages

on:
  pull_request:
    paths:
      - ".github/workflows/windows-packages.yml"
      - "examples/pixi-consumer/**"
      - "packaging/**"
      - "tools/build-windows-msvc.ps1"
      - "tools/check-windows-package-ci.rb"
      - "tools/test-windows-package-ci.rb"
      - "tools/export-windows-env.ps1"
      - "tools/install-ruby-tools.ps1"
      - "tools/stage-license-corpus.rb"
      - "tools/prepare-windows-conda-release.ps1"
      - "tools/test-windows-conda-consumer.ps1"
      - "tools/test-windows-env-batch.ps1"
      - "tools/test-windows-source-lock.ps1"
      - "tools/windows-generator-smoke/**"
      - "tools/windows-opcua-start-smoke.ops"
      - "tools/windows-patches/**"
      - "tools/windows-source-lock.ps1"
      - ".gitattributes"
      - ".gitignore"
      - "pixi.toml"
      - "pixi.lock"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/windows-packages.yml"
      - "examples/pixi-consumer/**"
      - "packaging/**"
      - "tools/build-windows-msvc.ps1"
      - "tools/check-windows-package-ci.rb"
      - "tools/test-windows-package-ci.rb"
      - "tools/export-windows-env.ps1"
      - "tools/install-ruby-tools.ps1"
      - "tools/stage-license-corpus.rb"
      - "tools/prepare-windows-conda-release.ps1"
      - "tools/test-windows-conda-consumer.ps1"
      - "tools/test-windows-env-batch.ps1"
      - "tools/test-windows-source-lock.ps1"
      - "tools/windows-generator-smoke/**"
      - "tools/windows-opcua-start-smoke.ops"
      - "tools/windows-patches/**"
      - "tools/windows-source-lock.ps1"
      - ".gitattributes"
      - ".gitignore"
      - "pixi.toml"
      - "pixi.lock"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

env:
  PREFIX_CHANNEL: liufang-robot/orocos
  PUBLIC_CHANNEL_URL: https://prefix.dev/liufang-robot/orocos
  RELEASE_BUNDLE: packaging/conda/output/release
  OROCOS_VCPKG_ROOT: ${{ github.workspace }}/.cache/vcpkg/root
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.cache/vcpkg/downloads

concurrency:
  group: windows-conda-packages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  build-packages:
    name: Windows packages / build and test
    if: >-
      github.event_name != 'release' ||
      (github.event.action == 'published' &&
      github.event.release.prerelease == false &&
      github.repository == 'liufang-robot/rock-orocos')
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is reachable from main
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $protectedMainRef = "refs/remotes/origin/release-protected-main"
          & git fetch --no-tags --prune --no-recurse-submodules origin `
            "refs/heads/main:$protectedMainRef"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch protected main."
          }
          & git merge-base --is-ancestor $env:GITHUB_SHA $protectedMainRef
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $env:GITHUB_SHA is not reachable from protected main."
          }

      - name: Validate Windows batch activation
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File tools/test-windows-env-batch.ps1

      - name: Set up locked Pixi package environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.76.2
          environments: package
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Identify vcpkg cache compatibility
        id: vcpkg-cache-compatibility
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            "Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "Cannot identify MSVC for the installed vcpkg cache."
          }
          $installationVersion = [string](& $vswhere -latest -products "*" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationVersion)
          $installationVersion = $installationVersion.Trim()
          if ([string]::IsNullOrWhiteSpace($installationVersion)) {
            throw "vswhere did not return an MSVC installation version."
          }
          "msvc=$installationVersion" >> $env:GITHUB_OUTPUT

      - name: Restore installed vcpkg tree
        id: vcpkg-installed-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/vcpkg/root/installed
          key: windows-vcpkg-installed-v1-windows-2022-msvc-${{ steps.vcpkg-cache-compatibility.outputs.msvc }}-x64-windows-${{ hashFiles('packaging/source-lock.json', 'tools/build-windows-msvc.ps1') }}

      - name: Restore vcpkg downloads and binary packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            .cache/vcpkg/archives
            .cache/vcpkg/downloads
          key: windows-vcpkg-artifacts-v2-windows-2022-msvc-${{ steps.vcpkg-cache-compatibility.outputs.msvc }}-x64-windows-${{ hashFiles('packaging/source-lock.json', 'tools/build-windows-msvc.ps1') }}
          restore-keys: |
            windows-vcpkg-artifacts-v2-windows-2022-msvc-${{ steps.vcpkg-cache-compatibility.outputs.msvc }}-x64-windows-

      - name: Validate Windows source lock
        shell: pwsh
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File tools/test-windows-source-lock.ps1

      - name: Render package recipe
        shell: pwsh
        run: pixi run --locked package-render

      - name: Build and test package artifacts
        shell: pwsh
        run: |
          New-Item packaging/conda/output -ItemType Directory -Force | Out-Null
          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & pixi run --locked package-build 2>&1 |
            Tee-Object -FilePath packaging/conda/output/ci-package-build.log
          $buildExitCode = $LASTEXITCODE
          $ErrorActionPreference = $savedErrorActionPreference
          if ($buildExitCode -ne 0) {
            exit $buildExitCode
          }

      - name: Report package build failure
        if: failure()
        shell: pwsh
        run: |
          $logPath = 'packaging/conda/output/ci-package-build.log'
          $detailPaths = @(
            Get-ChildItem packaging/conda/output -Recurse -File `
              -Filter conda_build.log -ErrorAction SilentlyContinue |
              Sort-Object LastWriteTime -Descending |
              Select-Object -First 2 -ExpandProperty FullName
          )
          if (Test-Path -LiteralPath $logPath -PathType Leaf) {
            $message = (Get-Content -LiteralPath $logPath -Tail 20) -join "`n"
          } else {
            $message = "Missing package build console log: $logPath"
          }
          foreach ($detailPath in $detailPaths) {
            $detail = (Get-Content -LiteralPath $detailPath -Tail 30) -join "`n"
            $message += "`n--- $detailPath ---`n$detail"
          }
          $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
          Write-Host "::error title=Windows package build diagnostic::$message"

      - name: Prepare verified release bundle
        shell: pwsh
        run: |
          $logPath = 'packaging/conda/output/ci-release-stage.log'
          $packageDirectory = 'packaging/conda/output/win-64'
          "Package inventory before release staging:" | Tee-Object -FilePath $logPath
          Get-ChildItem -LiteralPath $packageDirectory -File -ErrorAction SilentlyContinue |
            Select-Object Name, Length |
            Format-Table -AutoSize |
            Out-String |
            Tee-Object -FilePath $logPath -Append
          if (Test-Path -LiteralPath $env:RELEASE_BUNDLE) {
            "Release directory already exists before staging:" |
              Tee-Object -FilePath $logPath -Append
            Get-ChildItem -LiteralPath $env:RELEASE_BUNDLE -Force |
              Select-Object Name, Length |
              Format-Table -AutoSize |
              Out-String |
              Tee-Object -FilePath $logPath -Append
          } else {
            "Release directory does not exist before staging." |
              Tee-Object -FilePath $logPath -Append
          }
          $savedErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          & pixi run --locked -e package powershell.exe `
            -NoProfile -ExecutionPolicy Bypass `
            -File tools/prepare-windows-conda-release.ps1 `
            -Mode Stage `
            -RepositoryCommit $env:GITHUB_SHA 2>&1 |
            Tee-Object -FilePath $logPath -Append
          $stageExitCode = $LASTEXITCODE
          $ErrorActionPreference = $savedErrorActionPreference
          if ($stageExitCode -ne 0) {
            $message = (Get-Content -LiteralPath $logPath -Tail 40) -join "`n"
            $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows release staging diagnostic::$message"
            exit $stageExitCode
          }

      - name: Test clean local-channel consumers
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File tools/test-windows-conda-consumer.ps1 `
            -ManifestPath "$env:RELEASE_BUNDLE/release-manifest.json" `
            -LocalChannelPath packaging/conda/output

      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: orocos-windows-packages-${{ github.sha }}
          path: ${{ env.RELEASE_BUNDLE }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload package build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: orocos-windows-package-logs-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packaging/conda/output/*.log
            packaging/conda/output/**/*.log
            packaging/conda/output/bld/**/CMakeFiles/CMakeOutput.log
            packaging/conda/output/bld/**/CMakeFiles/CMakeError.log

  publish-packages:
    name: Windows packages / publish to Prefix
    needs: build-packages
    if: >-
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      github.event.release.prerelease == false &&
      github.repository == 'liufang-robot/rock-orocos'
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit is reachable from main
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $protectedMainRef = "refs/remotes/origin/release-protected-main"
          & git fetch --no-tags --prune --no-recurse-submodules origin `
            "refs/heads/main:$protectedMainRef"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch protected main."
          }
          & git merge-base --is-ancestor $env:GITHUB_SHA $protectedMainRef
          if ($LASTEXITCODE -ne 0) {
            throw "Release commit $env:GITHUB_SHA is not reachable from protected main."
          }

      - name: Set up locked Pixi package environment
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347 # v0.10.1
        with:
          pixi-version: v0.76.2
          environments: package
          locked: true
          cache: true
          cache-write: false

      - name: Download verified release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: orocos-windows-packages-${{ github.sha }}
          path: ${{ env.RELEASE_BUNDLE }}

      - name: Verify release tag, commit, metadata, and checksums
        shell: pwsh
        env:
          EXPECTED_RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          pixi run --locked -e package powershell.exe `
            -NoProfile -ExecutionPolicy Bypass `
            -File tools/prepare-windows-conda-release.ps1 `
            -Mode Verify `
            -ExpectedTag $env:EXPECTED_RELEASE_TAG `
            -ExpectedRepositoryCommit $env:GITHUB_SHA

      - name: Publish immutable packages
        shell: pwsh
        run: |
          $manifest = Get-Content `
            -LiteralPath "$env:RELEASE_BUNDLE/release-manifest.json" `
            -Raw | ConvertFrom-Json
          $packageFiles = @(
            $manifest.packages | ForEach-Object {
              Join-Path $env:RELEASE_BUNDLE $_.filename
            }
          )
          if ($packageFiles.Count -ne 2) {
            throw "Expected exactly two release packages."
          }
          & pixi run --locked -e package rattler-build upload prefix `
            --channel $env:PREFIX_CHANNEL @packageFiles
          if ($LASTEXITCODE -ne 0) {
            throw "Prefix package upload failed with exit code $LASTEXITCODE."
          }

      - name: Test clean public-channel consumers
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass `
            -File tools/test-windows-conda-consumer.ps1 `
            -ManifestPath "$env:RELEASE_BUNDLE/release-manifest.json" `
            -ChannelUrl $env:PUBLIC_CHANNEL_URL `
            -Attempts 6 `
            -RetryDelaySeconds 10
