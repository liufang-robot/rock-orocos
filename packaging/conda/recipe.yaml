schema_version: 1

context:
  version: "0.1.1"
  build_number: 0

recipe:
  name: orocos-distribution
  version: ${{ version }}

source:
  - path: ../..
    use_gitignore: true
    filter:
      include:
        - packaging/license-corpus.json
        - packaging/source-lock.json
        - packaging/conda/build.ps1
        - packaging/conda/orocos-activate.bat
        - packaging/conda/stage-runtime-hook.ps1
        - packaging/conda/prepare-prefix.ps1
        - tools/build-windows-msvc.ps1
        - tools/export-windows-env.ps1
        - tools/install-ruby-tools.ps1
        - tools/stage-license-corpus.rb
        - tools/windows-source-lock.ps1
        - tools/windows-generator-smoke/**
        - tools/windows-opcua-start-smoke.ops
        - tools/windows-patches/**
  - url: https://rubygems.org/downloads/facets-3.1.0.gem
    sha256: 7834a68824efbb35380ed7f6f590e01fb9a31a9466e317210e8803f72813c345
    target_directory: .ruby-gems
  - url: https://rubygems.org/downloads/backports-3.25.3.gem
    sha256: 94298d32dc3c40ca15633b54e282780b49e2db0c045f602ea1907e4f63a17235
    target_directory: .ruby-gems
  - url: https://rubygems.org/downloads/base64-0.3.0.gem
    sha256: 27337aeabad6ffae05c265c450490628ef3ebd4b67be58257393227588f5a97b
    target_directory: .ruby-gems
  - url: https://rubygems.org/downloads/rexml-3.4.4.gem
    sha256: 19e0a2c3425dfbf2d4fc1189747bdb2f849b6c5e74180401b15734bc97b5d142
    target_directory: .ruby-gems
  - url: https://rubygems.org/downloads/kramdown-2.5.2.gem
    sha256: 1ba542204c66b6f9111ff00dcc26075b95b220b07f2905d8261740c82f7f02fa
    target_directory: .ruby-gems
  - url: https://rubygems.org/downloads/rake-13.4.2.gem
    sha256: cb825b2bd5f1f8e91ca37bddb4b9aaf345551b4731da62949be002fa89283701
    target_directory: .ruby-gems

outputs:
  - staging:
      name: orocos-build
    requirements:
      build:
        - ${{ compiler('cxx') }}
        - castxml >=0.7,<0.8
        - cmake >=3.28,<4
        - git >=2.45,<3
        - pkg-config >=0.29,<1
        - ruby >=3.4,<3.5
        - zstd >=1.5,<2
    build:
      script:
        file: build.ps1

  - package:
      name: orocos
    inherit:
      from: orocos-build
      run_exports: false
    build:
      number: ${{ build_number }}
      script:
        file: stage-runtime-hook.ps1
      files:
        include:
          - Library/bin/*.dll
          - Library/bin/*.exe
          - Library/lib/orocos/**/*.dll
          - Library/lib/typelib/*.dll
          - Library/env.bat
          - Library/env.ps1
          - Library/share/licenses/orocos/**
          - etc/conda/activate.d/orocos-activate.bat
    requirements:
      run:
        - vc14_runtime >=14.44,<15
    tests:
      - package_contents:
          files:
            exists:
              - Library/bin/deployer-opcua-win32.exe
              - Library/bin/readline.dll
              - Library/env.bat
              - Library/env.ps1
              - etc/conda/activate.d/orocos-activate.bat
              - Library/share/licenses/orocos/LICENSES.md
              - Library/share/licenses/orocos/manifest.json
              - Library/lib/orocos/win32/types/rtt-typekit-win32.dll
            not_exists:
              - Library/dev-env.ps1
              - Library/include/orocos/rtt/RTT.hpp
              - Library/share/licenses/orocos-dev/LICENSES.md
      - script: test-runtime.ps1
    about:
      homepage: https://github.com/liufang-robot/rock-orocos
      repository: https://github.com/liufang-robot/rock-orocos
      documentation: https://liufang-robot.github.io/rock-orocos/
      license: (MIT AND BSD-2-Clause AND BSD-3-Clause AND LicenseRef-rtlog-cpp-Bundled-License-Exceptions AND LicenseRef-Orocos-RTT-GPL-2.0-Linking-Exception AND LicenseRef-Orocos-RTT-TLSF-Linking-Exception AND MPL-2.0 AND CC0-1.0 AND Apache-2.0 AND BSL-1.0 AND LicenseRef-open62541-base64-BSD AND GPL-2.0-or-later AND LGPL-2.1-or-later AND LicenseRef-OCL-GPL-2.0-Linking-Exception AND CECILL-B AND LicenseRef-MetaRuby-Conflicting-BSD-LGPLv3-Declarations AND LicenseRef-MetaRuby-Bundled-jQuery-Notices AND Ruby AND LicenseRef-Ruby-base64-Mixed-Legal-Notices AND LicenseRef-Ruby-facets-Mixed-Bundled-Notices) AND LicenseRef-Windows-vcpkg-Bundled-Dependencies
      license_file:
        - ${{ PREFIX }}/Library/share/licenses/orocos/**
      summary: Orocos RTT runtime with OCL and native OPC UA tools for Windows
      description: |
        A relocatable Windows Orocos runtime containing RTT, OCL deployers,
        scripting support, type transports, and the native OPC UA server and
        TaskBrowser client. Install orocos-dev for headers and generators.

  - package:
      name: orocos-dev
    inherit:
      from: orocos-build
      run_exports: false
    build:
      number: ${{ build_number }}
      files:
        include:
          - Library/bin/orocreate-*
          - Library/dev-env.ps1
          - Library/include/**
          - Library/lib/**/*.lib
          - Library/lib/cmake/**
          - Library/lib/pkgconfig/**
          - Library/lib/ruby/**
          - Library/share/**
          - Library/share/licenses/orocos-dev/**
          - Library/toolchain/**
          - Library/vcpkg/**
        exclude:
          - Library/share/licenses/orocos/**
    requirements:
      run:
        - ${{ pin_subpackage('orocos', exact=True) }}
        - castxml >=0.7,<0.8
        - cmake >=3.28,<4
        - cxx-compiler >=1.11,<3
        - pkg-config >=0.29,<1
        - ruby >=3.4,<3.5
        - zstd >=1.5,<2
    tests:
      - package_contents:
          files:
            exists:
              - Library/dev-env.ps1
              - Library/include/orocos/rtt/RTT.hpp
              - Library/lib/cmake/orocos-rtt/orocos-rtt-config.cmake
              - Library/share/licenses/orocos-dev/LICENSES.md
              - Library/share/licenses/orocos-dev/manifest.json
              - Library/toolchain/bin/orogen.bat
              - Library/toolchain/bin/typegen.bat
              - Library/vcpkg/include/boost/version.hpp
            not_exists:
              - Library/bin/deployer-opcua-win32.exe
              - Library/env.bat
              - Library/env.ps1
              - etc/conda/activate.d/orocos-activate.bat
              - Library/share/licenses/orocos/LICENSES.md
      - script: test-dev.ps1
        files:
          recipe:
            - test-data/**
    about:
      homepage: https://github.com/liufang-robot/rock-orocos
      repository: https://github.com/liufang-robot/rock-orocos
      documentation: https://liufang-robot.github.io/rock-orocos/
      license: (MIT AND BSD-2-Clause AND BSD-3-Clause AND LicenseRef-rtlog-cpp-Bundled-License-Exceptions AND LicenseRef-Orocos-RTT-GPL-2.0-Linking-Exception AND LicenseRef-Orocos-RTT-TLSF-Linking-Exception AND MPL-2.0 AND CC0-1.0 AND Apache-2.0 AND BSL-1.0 AND LicenseRef-open62541-base64-BSD AND GPL-2.0-or-later AND LGPL-2.1-or-later AND LicenseRef-OCL-GPL-2.0-Linking-Exception AND CECILL-B AND LicenseRef-MetaRuby-Conflicting-BSD-LGPLv3-Declarations AND LicenseRef-MetaRuby-Bundled-jQuery-Notices AND Ruby AND LicenseRef-Ruby-base64-Mixed-Legal-Notices AND LicenseRef-Ruby-facets-Mixed-Bundled-Notices) AND LicenseRef-Windows-vcpkg-Bundled-Dependencies
      license_file:
        - ${{ PREFIX }}/Library/share/licenses/orocos-dev/**
      summary: Orocos development SDK with OroGen and Typegen for Windows
      description: |
        Headers, CMake and pkg-config metadata, the bundled dependency SDK,
        Ruby generator libraries, OroGen, and Typegen for building Orocos
        components and typekits. The matching orocos runtime is installed
        automatically.

about:
  homepage: https://github.com/liufang-robot/rock-orocos
  repository: https://github.com/liufang-robot/rock-orocos
  documentation: https://liufang-robot.github.io/rock-orocos/
  license: (MIT AND BSD-2-Clause AND BSD-3-Clause AND LicenseRef-rtlog-cpp-Bundled-License-Exceptions AND LicenseRef-Orocos-RTT-GPL-2.0-Linking-Exception AND LicenseRef-Orocos-RTT-TLSF-Linking-Exception AND MPL-2.0 AND CC0-1.0 AND Apache-2.0 AND BSL-1.0 AND LicenseRef-open62541-base64-BSD AND GPL-2.0-or-later AND LGPL-2.1-or-later AND LicenseRef-OCL-GPL-2.0-Linking-Exception AND CECILL-B AND LicenseRef-MetaRuby-Conflicting-BSD-LGPLv3-Declarations AND LicenseRef-MetaRuby-Bundled-jQuery-Notices AND Ruby AND LicenseRef-Ruby-base64-Mixed-Legal-Notices AND LicenseRef-Ruby-facets-Mixed-Bundled-Notices) AND LicenseRef-Windows-vcpkg-Bundled-Dependencies
  summary: Native Windows Orocos runtime and development toolchain
  description: |
    A relocatable Orocos/Rock toolchain split into runtime and development
    packages for native Windows consumers.

extra:
  recipe-maintainers:
    - liufang-robot
